issueTrackerURL="https://github.com/Santi-PdR/GripeVerde/issues"

[[mods]]
modId="gripeverde"
version="${mod_version}"
# El mod es 100% cliente (sin componente servidor): no marca incompatibilidad
# de version en ningun lado. Guia Forge Sides para mods one-sided.
displayTest="IGNORE_ALL_VERSION"
displayName="Eternal Craft: Gripe Verde"
# v0.331.0: el sello de la casa, para la lista de mods del juego.
logoFile="logo.png"
displayURL="https://discord.gg/qrBCgYuwWb"
credits="Documento oficial bajo sello EC-QV/1897 - Cronista S. Pereira"
authors="Santipdr"
description='''
Eternal Craft: Gripe Verde
Un gabinete victoriano bajo cuarentena.

Un mod de atmosfera para jugar solo o en compania: la interfaz entera es un
diario de campana, con sus fichas, sus sellos de lacre y los partes de CEDA
mecanografiados a mano.

  - Diario, partes de CEDA y gabinete de fichas por descubrir
  - Menus, pausa, opciones e inventario dibujados sobre papel
  - Reloj de la vigilia, escena de fondo viva y sonido de epoca
  - Mod 100% de cliente: entra en cualquier servidor sin instalar nada

Cronista: S. Pereira - registro EC-QV/1897
Autor: Santipdr
Discord: https://discord.gg/qrBCgYuwWb

Etapa 1800x - Sobrevive a la plaga.
'''

[[dependencies.gripeverde]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.gripeverde]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
