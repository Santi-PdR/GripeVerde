org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# v0.236.0: la maven de Forge responde lento por rachas. Con los timeouts
# cortos de Gradle (10 s de conexion / 30 s de lectura) una descarga lenta
# tumbaba el build entero; con estos margenes se espera y se reintenta.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
