name: Build GripeVerde

on:
  push:
    # v0.182.0: la rama de la sesion tambien compila; antes solo main y los PR.
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar el JAR como release de GitHub (descarga directa, sin zip)'
        type: boolean
        default: false
      release_tag:
        description: 'Tag del release; vacio usa la version de build.gradle con prefijo v'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gripeverde-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # El build ejecuta código del repo; conserva solo el token de lectura.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Gradle executes repository code; do not persist the checkout token.
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # v0.183.0: primero el lint (instantaneo) y despues Gradle; asi un import
      # faltante no cuesta dos minutos de compilacion.
      - name: Verify mirrored assets, localization and imports
        run: python3 tools/verify_mirrors.py
      # v0.278.0: el lint barato de Java caza @Override huerfanos, variables
      # repetidas y sentencias cortadas antes de gastar dos minutos de Gradle.
      - name: Lint Java structure
        run: python3 tools/lint_java.py
      - name: Test title opening counter boundaries
        run: python3 tools/test_title_open_count.py --require-java
      - name: Test menu music playback lifecycle
        run: python3 tools/test_menu_music.py --require-java
      - name: Test discovery APIs and notifications
        run: python3 tools/test_discoveries.py --require-java
      - name: Test marginalia text layout and cache
        run: python3 tools/test_marginalia_layout.py --require-java
      - name: Test memory shutdown lock and writer
        run: python3 tools/test_memory_shutdown.py --require-java
      - name: Test multiplayer count cache
        run: python3 tools/test_server_count.py --require-java
      - name: Test dispatch hotkey focus and edges
        run: python3 tools/test_dispatch_hotkeys.py --require-java
      - name: Test dispatch save scheduling
        run: python3 tools/test_dispatch_save.py --require-java
      - name: Test language screen state
        run: python3 tools/test_language_screen.py --require-java
      - name: Test Java scroll controller
        run: python3 tools/test_smooth_scroll.py --require-java
      - name: Test list rendering guards
        run: python3 tools/test_list_render_guards.py
      - name: Test release publishing gate
        run: python3 tools/ci/test_release_gate.py
      - name: Test PowerShell installer safety
        run: python3 tools/ci/test_installer.py
      - name: Build mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon clean build 2>&1 | tee /tmp/build.log
      - name: Upload mod JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GripeVerde-jar
          path: build/libs/gripeverde-*.jar
          if-no-files-found: error
      # El log viaja a un job separado para que Gradle nunca tenga token de escritura.
      - name: Prepare build failure log
        if: failure() && !cancelled()
        run: |
          if [ ! -s /tmp/build.log ]; then
            printf '%s\n' 'Build failed before Gradle produced a log.' > /tmp/build.log
          fi
      - name: Upload build failure log
        if: failure() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GripeVerde-build-failure-log
          path: /tmp/build.log
          retention-days: 2
          if-no-files-found: error

  report-build-failure:
    if: ${{ always() && needs.build.result == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download build failure log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GripeVerde-build-failure-log
          path: build-failure
      - name: Report build errors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LOG_FILE=build-failure/build.log
          {
            grep -nE '(\.java:[0-9]+|error:|What went wrong|Execution failed)' "$LOG_FILE" | head -40 || true
            echo '---'
            tail -n 40 "$LOG_FILE" || true
          } > /tmp/report.txt || true
          {
            echo 'El build fallo. Extracto del log:'
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } > /tmp/body.md || true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -F body="$(cat /tmp/body.md)" >/dev/null
          fi

  # El JAR se publica como asset directo, no como zip de artifact. En push,
  # release-tag.txt debe coincidir con build.gradle; en workflow_dispatch se
  # exige el checkbox y el tag vacio usa la version actual. Los PR nunca publican
  # y un release existente no se sobrescribe. --target GITHUB_SHA hace coincidir
  # el codigo fuente del tag con el JAR publicado.
  publish:
    # Los PR compilan, pero nunca deben publicar releases ni tags.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release marker
        id: marker
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE_INPUT: ${{ inputs.publish_release }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: python3 tools/ci/release_gate.py
      - name: Download JAR
        if: steps.marker.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GripeVerde-jar
          path: dist
      - name: Publish release
        if: steps.marker.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "el release $TAG ya existe; no lo sobrescribo"
          else
            awk '/^## v/{n++} n<2' CHANGELOG.md > /tmp/release-notes.md || true
            gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GripeVerde $TAG" --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '"release \(.tagName)", (.assets[] | "\(.name) \(.size) \(.url)")'
