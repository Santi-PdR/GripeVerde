name: Build GripeVerde

on:
  push:
    # v0.182.0: la rama de la sesion tambien compila; antes solo main y los PR.
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar el JAR como release de GitHub (descarga directa, sin zip)'
        type: boolean
        default: false
      release_tag:
        description: 'Tag del release; vacio usa la version de build.gradle con prefijo v'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gripeverde-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # comentario de commit cuando un push falla
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Gradle executes repository code; do not persist the checkout token.
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # v0.183.0: primero el lint (instantaneo) y despues Gradle; asi un import
      # faltante no cuesta dos minutos de compilacion.
      - name: Verify mirrored assets, localization and imports
        run: python3 tools/verify_mirrors.py
      # v0.278.0: el lint barato de Java caza @Override huerfanos, variables
      # repetidas y sentencias cortadas antes de gastar dos minutos de Gradle.
      - name: Lint Java structure
        run: python3 tools/lint_java.py
      - name: Build mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon clean build 2>&1 | tee /tmp/build.log
      # El log de un run no se puede leer sin sesion en el navegador; en cambio
      # un comentario en el PR si. Cuando el build falla, el error queda escrito
      # ahi mismo, con las lineas .java: N y las ultimas cuarenta del log.
      - name: Report build errors
        if: failure() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            grep -nE '(\.java:[0-9]+|error:|What went wrong|Execution failed)' /tmp/build.log | head -40 || true
            echo '---'
            tail -n 40 /tmp/build.log || true
          } > /tmp/report.txt || true
          {
            echo 'El build fallo. Extracto del log:'
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } > /tmp/body.md || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -F body="$(cat /tmp/body.md)" >/dev/null
          fi
      - name: Upload mod JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GripeVerde-jar
          path: build/libs/gripeverde-*.jar
          if-no-files-found: error

  # v0.179.0: el JAR como asset de release, para tener una descarga directa
  # (.jar, no el zip del artefacto). Solo publica cuando release-tag.txt coincide
  # con la version de build.gradle, asi que un push normal no crea nada y un
  # release nunca se sobrescribe con el build de otra version. --target GITHUB_SHA
  # hace que el codigo fuente del tag corresponda al JAR publicado.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release marker
        id: marker
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          MARKER="$(head -n1 release-tag.txt 2>/dev/null | tr -d '[:space:]' || true)"
          VERSION="$(grep -m1 '^version = ' build.gradle | cut -d"'" -f2)"
          TAG_INPUT="${RELEASE_TAG_INPUT:-}"
          if [ -n "$TAG_INPUT" ]; then MARKER="$TAG_INPUT"; fi
          echo "marker=$MARKER version=$VERSION"
          if [ -n "$MARKER" ] && [ "$MARKER" = "v$VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$MARKER" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download JAR
        if: steps.marker.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GripeVerde-jar
          path: dist
      - name: Publish release
        if: steps.marker.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "el release $TAG ya existe; no lo sobrescribo"
          else
            awk '/^## v/{n++} n<2' CHANGELOG.md > /tmp/release-notes.md || true
            gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GripeVerde $TAG" --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '"release \(.tagName)", (.assets[] | "\(.name) \(.size) \(.url)")'
