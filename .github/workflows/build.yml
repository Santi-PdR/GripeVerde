name: Build GripeVerde

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar el JAR como release de GitHub (descarga directa, sin zip)'
        type: boolean
        default: false
      release_tag:
        description: 'Tag del release; vacio usa la version de build.gradle con prefijo v'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gripeverde-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify mirrored assets and localization
        run: python3 tools/verify_mirrors.py
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GripeVerde-jar
          path: build/libs/gripeverde-*.jar
          if-no-files-found: error

  # v0.179.0: el JAR como asset de release, para tener una descarga directa
  # (.jar, no el zip del artefacto). Solo publica cuando release-tag.txt coincide
  # con la version de build.gradle, asi que un push normal no crea nada y un
  # release nunca se sobrescribe con el build de otra version.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read release marker
        id: marker
        run: |
          set -euo pipefail
          MARKER="$(head -n1 release-tag.txt 2>/dev/null | tr -d '[:space:]' || true)"
          VERSION="$(grep -m1 '^version = ' build.gradle | cut -d"'" -f2)"
          TAG_INPUT="${{ inputs.release_tag }}"
          if [ -n "$TAG_INPUT" ]; then MARKER="$TAG_INPUT"; fi
          echo "marker=$MARKER version=$VERSION"
          if [ -n "$MARKER" ] && [ "$MARKER" = "v$VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$MARKER" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download JAR
        if: steps.marker.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: GripeVerde-jar
          path: dist
      - name: Publish release
        if: steps.marker.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "el release $TAG ya existe; no lo sobrescribo"
          else
            awk '/^## v/{n++} n<2' CHANGELOG.md > /tmp/release-notes.md || true
            gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --title "GripeVerde $TAG" --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '"release \(.tagName)", (.assets[] | "\(.name) \(.size) \(.url)")'
