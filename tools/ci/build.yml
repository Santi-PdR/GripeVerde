# Plantilla de CI artifact-only para recuperación manual.
# El workflow activo y completo está en .github/workflows/build.yml: incluye
# publicación de releases con una compuerta probada aparte. No reemplazarlo por
# esta plantilla si se necesita conservar esa publicación controlada.
# Mantener aquí los mismos checks baratos y los mismos SHA de acciones.

name: Build GripeVerde (artifact template)

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: gripeverde-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache incluida)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify mirrored assets and localization
        run: python3 tools/verify_mirrors.py

      - name: Lint Java structure
        run: python3 tools/lint_java.py

      - name: Test house audio volume wiring
        run: python3 tools/test_house_audio.py --require-java
      - name: Test slider pointer and keyboard gestures
        run: python3 tools/test_slider_input.py --require-java
      - name: Test title opening counter boundaries
        run: python3 tools/test_title_open_count.py --require-java
      - name: Test menu music playback lifecycle
        run: python3 tools/test_menu_music.py --require-java
      - name: Test discovery APIs and notifications
        run: python3 tools/test_discoveries.py --require-java
      - name: Test marginalia text layout and cache
        run: python3 tools/test_marginalia_layout.py --require-java
      - name: Test memory shutdown lock and writer
        run: python3 tools/test_memory_shutdown.py --require-java
      - name: Test multiplayer count cache
        run: python3 tools/test_server_count.py --require-java
      - name: Test dispatch hotkey focus and edges
        run: python3 tools/test_dispatch_hotkeys.py --require-java
      - name: Test dispatch save scheduling
        run: python3 tools/test_dispatch_save.py --require-java
      - name: Test language screen state
        run: python3 tools/test_language_screen.py --require-java

      - name: Test Java scroll controller
        run: python3 tools/test_smooth_scroll.py --require-java

      - name: Test list rendering guards
        run: python3 tools/test_list_render_guards.py

      - name: Test release publishing gate
        run: python3 tools/ci/test_release_gate.py

      - name: Build with ForgeGradle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gripeverde-jar
          path: build/libs/gripeverde-*.jar
          if-no-files-found: error
