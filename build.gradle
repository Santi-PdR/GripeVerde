plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '0.17.1'
group = 'com.eternalcraft.gripeverde'
base { archivesName = 'gripeverde' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'gripeverde'
            mods { "gripeverde" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'gripeverde' }
        server { property 'forge.enabledGameTestNamespaces', 'gripeverde'; args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "gripeverde.refmap.json"
    config "gripeverde.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: '1.20.1',
        forge_version: '47.4.20',
        mod_id: 'gripeverde',
        mod_version: project.version.toString()
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes([
            "Specification-Title"     : "gripeverde",
            "Specification-Vendor"    : "EternalCraft",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "EternalCraft",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "gripeverde.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')



tasks.register('verifyGripeVerdeLocalization') {
    group = 'verification'
    description = 'Verifies core localized files required by the client UI.'
    doLast {
        def langDir = file('src/main/resources/assets/gripeverde/lang')
        def changelogDir = file('src/main/resources/assets/gripeverde/changelog')
        def requiredLangs = ['en_us', 'en_gb', 'en_ca', 'en_au', 'en_nz',
            'es_es', 'es_mx', 'es_ar', 'es_419', 'es_bo', 'es_cl', 'es_co',
            'es_cr', 'es_do', 'es_ec', 'es_gt', 'es_hn', 'es_ni', 'es_pa',
            'es_pe', 'es_pr', 'es_py', 'es_sv', 'es_uy', 'es_ve']
        def missingLang = requiredLangs.findAll { !new File(langDir, "${it}.json").isFile() }
        def missingChangelog = requiredLangs.findAll { !new File(changelogDir, "${it}.md").isFile() }
        if (!missingLang.isEmpty()) {
            throw new GradleException("Missing lang JSON files: ${missingLang.join(', ')}")
        }
        if (!missingChangelog.isEmpty()) {
            throw new GradleException("Missing changelog markdown files: ${missingChangelog.join(', ')}")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeLocalization')
}

tasks.register('verifyGripeVerdeSoundAssets') {
    group = 'verification'
    description = 'Verifies sounds.json references existing OGG files.'
    doLast {
        def soundsJson = file('src/main/resources/assets/gripeverde/sounds.json')
        if (!soundsJson.isFile()) throw new GradleException('Missing sounds.json')
        def parsed = new groovy.json.JsonSlurper().parse(soundsJson)
        def base = file('src/main/resources/assets/gripeverde/sounds')
        def missing = []
        parsed.each { eventName, payload ->
            def sounds = payload.sounds ?: []
            sounds.each { entry ->
                def raw = entry instanceof Map ? entry.name : entry.toString()
                if (raw == null) return
                def path = raw.startsWith('gripeverde:') ? raw.substring('gripeverde:'.length()) : raw
                def f = new File(base, "${path}.ogg")
                if (!f.isFile()) missing << "${eventName} -> ${path}.ogg"
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing sound assets:\n" + missing.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeSoundAssets')
}

tasks.register('verifyGripeVerdeThemeAssets') {
    group = 'verification'
    description = 'Verifies the gripeverde_steel built-in resource pack (sizes, mcmeta, no orphans).'
    doLast {
        def packRoot = file('src/main/resources/resourcepacks/gripeverde_steel')
        if (!packRoot.isDirectory()) throw new GradleException("Missing pack dir: ${packRoot}")

        def mcmeta = new File(packRoot, 'pack.mcmeta')
        if (!mcmeta.isFile()) throw new GradleException('Missing pack.mcmeta')
        def parsed = new groovy.json.JsonSlurper().parse(mcmeta)
        if (parsed?.pack?.pack_format != 15) throw new GradleException('pack.mcmeta pack_format must be 15 (1.20.1)')

        def packPng = new File(packRoot, 'pack.png')
        if (!packPng.isFile()) throw new GradleException('Missing pack.png')
        def pp = javax.imageio.ImageIO.read(packPng)
        if (pp == null || pp.getWidth() != 128 || pp.getHeight() != 128)
            throw new GradleException('pack.png must be 128x128')

        def containerDir = new File(packRoot, 'assets/minecraft/textures/gui/container')
        // Solo texturas reales de 1.20.1 (sin dropper.png ni villager2.png, que no existen)
        def required = ['inventory.png','generic_54.png','crafting_table.png','furnace.png','blast_furnace.png',
                        'smoker.png','shulker_box.png','anvil.png','grindstone.png','enchanting_table.png',
                        'beacon.png','brewing_stand.png','hopper.png','dispenser.png','loom.png',
                        'cartography_table.png','stonecutter.png','smithing.png','horse.png','villager.png']
        def missing = required.findAll { !new File(containerDir, it).isFile() }
        if (!missing.isEmpty()) throw new GradleException("Missing container PNGs: ${missing.join(', ')}")
        def badDim = []
        required.each { name ->
            def f = new File(containerDir, name)
            def img = javax.imageio.ImageIO.read(f)
            if (img == null) { badDim << "${name}: unreadable"; return }
            def expW = name.startsWith('villager') ? 512 : 256
            if (img.getWidth() != expW || img.getHeight() != 256)
                badDim << "${name}: ${img.getWidth()}x${img.getHeight()} expected ${expW}x256"
        }
        def creativeDir = new File(containerDir, 'creative_inventory')
        ['tabs.png','tab_inventory.png','tab_items.png','tab_item_search.png'].each { name ->
            def f = new File(creativeDir, name)
            if (!f.isFile()) { missing << "creative_inventory/${name}"; return }
            def img = javax.imageio.ImageIO.read(f)
            if (img == null || img.getWidth() != 256 || img.getHeight() != 256)
                badDim << "creative_inventory/${name}"
        }
        if (!missing.isEmpty()) throw new GradleException("Missing PNGs: ${missing.join(', ')}")
        if (!badDim.isEmpty()) throw new GradleException("Bad dimensions:\n" + badDim.join('\n'))

        // Sprites con 9-slice deben conservar su .mcmeta
        def spritesDir = new File(packRoot, 'assets/minecraft/textures/gui/sprites')
        def needMcmeta = ['widget/button.png','widget/button_disabled.png','widget/button_highlighted.png',
                          'widget/slider.png','widget/slider_highlighted.png','widget/slider_handle.png',
                          'widget/slider_handle_highlighted.png','widget/text_field.png',
                          'widget/text_field_highlighted.png','widget/scroller.png']
        def missingMcmeta = needMcmeta.findAll { !new File(spritesDir, "${it}.mcmeta").isFile() }
        if (!missingMcmeta.isEmpty())
            throw new GradleException("Missing 9-slice mcmeta: ${missingMcmeta.join(', ')}")

        // Prohibido: texturas muertas de packs anteriores
        def orphans = ['dropper.png','villager2.png','inventory_backup.png']
        def found = orphans.findAll { new File(containerDir, it).isFile() }
        if (!found.isEmpty()) throw new GradleException("Orphan textures present: ${found.join(', ')}")

        println "verifyGripeVerdeThemeAssets: OK — 20 containers + 4 creative + sprites + pack.png 128x128 + pack_format 15"
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeThemeAssets')
}
