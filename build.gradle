plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '0.159.0'
group = 'com.eternalcraft.gripeverde'
base { archivesName = 'gripeverde' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// v0.23.0: eliminada la infraestructura de Mixins (el config estaba vacio,
// con 0 mixins, required:true y compatibilityLevel JAVA_8) y el namespace de
// GameTest (no existe ningun test). Menos puntos de fallo y build mas rapido.
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "gripeverde" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: '1.20.1',
        forge_version: '47.4.20',
        mod_id: 'gripeverde',
        mod_version: project.version.toString()
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes([
            "Specification-Title"     : "gripeverde",
            "Specification-Vendor"    : "EternalCraft",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "EternalCraft",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')



tasks.register('verifyGripeVerdeLocalization') {
    group = 'verification'
    description = 'Verifies localized JSON syntax/key parity and current changelog coverage.'
    doLast {
        def langDir = file('src/main/resources/assets/gripeverde/lang')
        def changelogDir = file('src/main/resources/assets/gripeverde/changelog')
        def requiredLangs = ['en_us', 'es_es']
        def requiredSet = requiredLangs as Set
        def availableLangs = fileTree(langDir) { include '*.json' }.files.collect {
            it.name - '.json'
        } as Set
        def availableChangelogs = fileTree(changelogDir) { include '*.md' }.files.collect {
            it.name - '.md'
        } as Set
        def missingLang = requiredSet - availableLangs
        def unexpectedLang = availableLangs - requiredSet
        def missingChangelog = requiredSet - availableChangelogs
        def unexpectedChangelog = availableChangelogs - requiredSet
        if (!missingLang.isEmpty()) {
            throw new GradleException("Missing lang JSON files: ${missingLang.sort().join(', ')}")
        }
        if (!unexpectedLang.isEmpty()) {
            throw new GradleException("Unexpected lang JSON files: ${unexpectedLang.sort().join(', ')}")
        }
        if (!missingChangelog.isEmpty()) {
            throw new GradleException("Missing changelog markdown files: ${missingChangelog.sort().join(', ')}")
        }
        if (!unexpectedChangelog.isEmpty()) {
            throw new GradleException("Unexpected changelog markdown files: ${unexpectedChangelog.sort().join(', ')}")
        }

        def json = new groovy.json.JsonSlurper()
        def baseline = json.parse(new File(langDir, 'en_us.json'))
        if (!(baseline instanceof Map)) {
            throw new GradleException('en_us.json root must be a JSON object')
        }
        def baselineKeys = baseline.keySet() as Set
        def expectedKeyCount = 175
        def problems = []
        if (baselineKeys.size() != expectedKeyCount) {
            problems << "en_us: expected ${expectedKeyCount} keys, found ${baselineKeys.size()}"
        }
        requiredLangs.each { locale ->
            def langFile = new File(langDir, "${locale}.json")
            try {
                def entries = json.parse(langFile)
                if (!(entries instanceof Map)) {
                    throw new IllegalArgumentException('root must be a JSON object')
                }
                def keys = entries.keySet() as Set
                def absent = baselineKeys - keys
                def extra = keys - baselineKeys
                def invalidValues = entries.findAll { key, value ->
                    !(value instanceof String) || value.trim().isEmpty()
                }.keySet()
                if (!absent.isEmpty()) problems << "${locale}: missing keys ${absent.sort()}"
                if (!extra.isEmpty()) problems << "${locale}: unexpected keys ${extra.sort()}"
                if (!invalidValues.isEmpty()) {
                    problems << "${locale}: non-string or blank values ${invalidValues.sort()}"
                }
            } catch (Exception failure) {
                problems << "${locale}: invalid JSON (${failure.message})"
            }

            def changelog = new File(changelogDir, "${locale}.md").getText('UTF-8')
            if (!changelog.contains("## Version ${project.version}")) {
                problems << "${locale}: changelog does not contain Version ${project.version}"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Localization validation failed:\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeLocalization')
}

tasks.register('verifyGripeVerdeSoundAssets') {
    group = 'verification'
    description = 'Verifies sound event structure, identifiers and exact OGG coverage.'
    doLast {
        def soundsJson = file('src/main/resources/assets/gripeverde/sounds.json')
        if (!soundsJson.isFile()) throw new GradleException('Missing sounds.json')
        def parsed = new groovy.json.JsonSlurper().parse(soundsJson)
        if (!(parsed instanceof Map)) {
            throw new GradleException('sounds.json root must be a JSON object')
        }

        def base = file('src/main/resources/assets/gripeverde/sounds')
        def problems = []
        def referenced = [] as Set
        parsed.each { eventName, payload ->
            if (!(eventName instanceof String) || !eventName.matches('[a-z0-9/._-]+') ||
                    eventName.startsWith('/') || eventName.split('/').any { it == '..' || it == '.' }) {
                problems << "invalid sound event id ${eventName}"
                return
            }
            if (!(payload instanceof Map) || !(payload.sounds instanceof List) || payload.sounds.isEmpty()) {
                problems << "${eventName}: sounds must be a non-empty list"
                return
            }

            payload.sounds.eachWithIndex { entry, index ->
                def raw = entry instanceof String ? entry : (entry instanceof Map ? entry.name : null)
                def type = entry instanceof Map && entry.containsKey('type') ? entry.type : 'file'
                if (!(raw instanceof String) || raw.trim().isEmpty()) {
                    problems << "${eventName}[${index}]: sound entry needs a non-blank name"
                    return
                }
                if (!(type instanceof String) || !(type in ['file', 'event'])) {
                    problems << "${eventName}[${index}]: unsupported sound type ${type}"
                    return
                }

                raw = raw.trim()
                def separator = raw.indexOf(':')
                def namespace = separator >= 0 ? raw.substring(0, separator) : 'gripeverde'
                def path = separator >= 0 ? raw.substring(separator + 1) : raw
                if (!namespace.matches('[a-z0-9_.-]+') || !path.matches('[a-z0-9/._-]+') ||
                        path.startsWith('/') || path.split('/').any { it == '..' || it == '.' }) {
                    problems << "${eventName}[${index}]: invalid sound id ${raw}"
                    return
                }

                // Foreign namespace entries are owned and validated by that namespace.
                if (namespace != 'gripeverde') return
                if (type == 'event') {
                    if (!parsed.containsKey(path)) problems << "${eventName}[${index}]: unknown sound event ${raw}"
                    return
                }

                def relative = "${path}.ogg"
                referenced << relative
                if (!new File(base, relative).isFile()) {
                    problems << "${eventName}[${index}]: missing ${relative}"
                }
            }
        }
        def available = fileTree(base) { include '**/*.ogg' }.collect { sound ->
            base.toPath().relativize(sound.toPath()).toString().replace('\\', '/')
        } as Set
        def orphaned = available - referenced
        if (!orphaned.isEmpty()) {
            problems << "unreferenced OGG assets: ${orphaned.sort().join(', ')}"
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Sound asset validation failed:\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeSoundAssets')
}

tasks.register('verifyGripeVerdeNoDeadCode') {
    group = 'verification'
    description = 'Fails if banned dead-code symbols appear in src/main/java (ignoring comments).'
    doLast {
        def banned = ['ThemeManager', 'GhoulPalette', 'ScreenLayout', 'ScreenTheme',
            'AbstractScreenTheme', 'UIComponent', 'UIScale', 'IconButton', 'SilentButton',
            'DiarySeparator', 'gripeverde_steel', 'steel_pack', 'bg_town', 'BG_TOWN',
            'hasBgTown', 'ResourcePackHandler', 'ContainerOverlayHandler',
            'setHoverSound', 'setClickSound', 'gripeverde.mixins', 'gripeverde.refmap',
            'VictorianFrame', 'AbstractDiaryScreen', 'DebugCanvasScreen', 'SoundLabScreen',
            'DiaryDecorator', 'CandleLight', 'InkEffects', 'DiaryVideoSettingsScreen', 'drawVictorianFrame', 'drawQuillCursor',
            'drawVerticalDivider', 'drawDarkLeatherBackground', 'drawVersionPanel',
            'getMoonPhaseIndex', 'getOpenCount', 'drawSolidBlob',
            'drawRowBands', 'openTelemetry', 'scrollToSection', 'drawGreeting',
            'drawSelectionLedger', 'drawHeraldTicker', 'drawStatusPill', 'drawCorrespondenceRack',
            'drawSignalStation', 'drawBottomNotice', 'drawSpecimenFooter', 'computePublicSignal',
            'drawLedgerDetails',
            'drawOrnamentalDivider']
        def pattern = ~/(?i)\b(?:${banned.join('|')})\b/
        def problems = []
        fileTree('src/main/java') { include '**/*.java' }.each { f ->
            f.readLines('UTF-8').eachWithIndex { line, idx ->
                def t = line.trim()
                if (t.startsWith('*') || t.startsWith('//') || t.startsWith('/*')) return
                if (pattern.matcher(t).find()) problems << "${f.name}:${idx + 1}: ${t}"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Codigo muerto detectado (verifyGripeVerdeNoDeadCode):\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeNoDeadCode')
}

tasks.register('verifyGripeVerdeVersionSync') {
    group = 'verification'
    description = 'Fails if GripeVerdeMod.VERSION does not match the Gradle project version.'
    doLast {
        def modSrc = file('src/main/java/com/eternalcraft/gripeverde/GripeVerdeMod.java')
        def srcText = modSrc.getText('UTF-8')
        def matcher = (srcText =~ /VERSION\s*=\s*"([^"]+)"/)
        if (!matcher.find()) {
            throw new GradleException('Cannot find VERSION constant in GripeVerdeMod.java')
        }
        if (matcher.group(1) != project.version.toString()) {
            throw new GradleException(
                "Version mismatch: GripeVerdeMod.VERSION=${matcher.group(1)} vs build.gradle version=${project.version}")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeVersionSync')
}

// Parser OGG Vorbis minimo: sample rate de la cabecera de identificacion y
// granule de la ultima pagina; duracion = granule / rate. Sin dependencias.
def gripeVerdeOggDurationMs = { File f ->
    byte[] bytes = f.bytes
    int len = bytes.length
    Integer rate = null
    long lastGranule = -1L
    int pos = 0
    while (true) {
        int idx = -1
        int i = Math.max(0, pos)
        while (i + 4 <= len) {
            if (bytes[i] == 0x4F && bytes[i + 1] == 0x67 && bytes[i + 2] == 0x67 && bytes[i + 3] == 0x53) {
                idx = i
                break
            }
            i++
        }
        if (idx < 0 || idx + 27 > len) break
        long granule = 0L
        for (int k = 7; k >= 0; k--) granule = (granule << 8) | (bytes[idx + 6 + k] & 0xFF)
        int nsegs = bytes[idx + 26] & 0xFF
        int segtabStart = idx + 27
        if (segtabStart + nsegs > len) break
        int bodyLen = 0
        for (int s = 0; s < nsegs; s++) bodyLen += bytes[segtabStart + s] & 0xFF
        int bodyStart = segtabStart + nsegs
        if (rate == null && bodyStart + 16 <= len) {
            if (bytes[bodyStart] == 0x01 && bytes[bodyStart + 1] == 0x76 &&
                    bytes[bodyStart + 2] == 0x6F && bytes[bodyStart + 3] == 0x72 &&
                    bytes[bodyStart + 4] == 0x62 && bytes[bodyStart + 5] == 0x69 &&
                    bytes[bodyStart + 6] == 0x73) {
                long r = 0L
                for (int k = 3; k >= 0; k--) r = (r << 8) | (bytes[bodyStart + 12 + k] & 0xFF)
                rate = (int) r
            }
        }
        if (granule >= 0L) lastGranule = granule
        pos = bodyStart + bodyLen
    }
    if (rate == null || rate <= 0 || lastGranule < 0L) {
        throw new GradleException("Cannot parse Vorbis duration of ${f.name}")
    }
    return (double) lastGranule / (double) rate * 1000.0d
}

tasks.register('verifyGripeVerdeMusicDurations') {
    group = 'verification'
    description = 'Fails if a music OGG deviates more than 1.5s from TRACK_DURATIONS_MS (crossfade guard).'
    doLast {
        def musicSrc = file('src/main/java/com/eternalcraft/gripeverde/client/audio/MenuMusic.java')
        def srcText = musicSrc.getText('UTF-8')
        def tableMatcher = (srcText =~ /TRACK_DURATIONS_MS\s*=\s*\{([^}]*)\}/)
        if (!tableMatcher.find()) {
            throw new GradleException('TRACK_DURATIONS_MS table not found in MenuMusic.java')
        }
        def declared = []
        (tableMatcher.group(1) =~ /(\d[\d_]*)/).each { m -> declared << (m[1].replace('_', '') as long) }
        def musicDir = file('src/main/resources/assets/gripeverde/sounds/music')
        def available = fileTree(musicDir) { include '*.ogg' }.files.sort().size()
        if (declared.size() != available) {
            throw new GradleException(
                "TRACK_DURATIONS_MS has ${declared.size()} entries but sounds/music has ${available} OGG files")
        }
        def problems = []
        declared.eachWithIndex { declaredMs, idx ->
            def f = new File(musicDir, "music_title_${idx + 1}.ogg")
            if (!f.isFile()) {
                problems << "missing music_title_${idx + 1}.ogg"
                return
            }
            long realMs = Math.round(gripeVerdeOggDurationMs(f))
            if (Math.abs(realMs - declaredMs) > 1_500L) {
                problems << "music_title_${idx + 1}.ogg: real=${realMs}ms vs declared=${declaredMs}ms"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Music duration validation failed:\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeMusicDurations')
}

tasks.register('verifyGripeVerdeSubtitles') {
    group = 'verification'
    description = 'Fails if a non-empty sounds.json subtitle key is missing or blank in any of the 25 lang files.'
    doLast {
        def soundsJson = file('src/main/resources/assets/gripeverde/sounds.json')
        def parsed = new groovy.json.JsonSlurper().parse(soundsJson)
        def required = ['en_us', 'es_es']
        def json = new groovy.json.JsonSlurper()
        def langDir = file('src/main/resources/assets/gripeverde/lang')
        def langs = [:]
        required.each { loc ->
            langs[loc] = json.parse(new File(langDir, "${loc}.json")) as Map
        }
        def problems = []
        parsed.each { ev, payload ->
            def sub = (payload instanceof Map) ? payload.subtitle : null
            if (sub instanceof String && sub.trim().length() > 0) {
                required.each { loc ->
                    def v = langs[loc][sub]
                    if (!(v instanceof String) || v.trim().isEmpty()) {
                        problems << "${ev}: subtitle ${sub} missing or blank in ${loc}"
                    }
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Subtitle validation failed:\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeSubtitles')
}

tasks.register('verifyGripeVerdeSoundUsage') {
    group = 'verification'
    description = 'Fails if a registered SoundEvent has no code usage, outside the grandfathered legacy allowlist.'
    doLast {
        // Eventos legacy sin uso devengados: se conservan hasta que el owner
        // decida conectarlos a momentos de UI o retirarlos.
        // Si alguno se conecta, sacarlo de la lista (el sello lo avisa); si
        // aparece un evento muerto nuevo, el build falla.
        // v0.24.0: UI_PAPER_FALL paso a la rotura del sello (DiaryTitleScreen)
        // y UI_SUCCESS al diapason de la sala de sonido (DiarySoundOptionsScreen).
        // v0.26.0: allowlist vacia — los 8 legacy (UI_BUTTON_CLEAN, UI_OPEN,
        // UI_CLOSE, UI_MODAL, UI_ERROR, UI_TAB, UI_CLICK_CREATE, UI_RESPAWN)
        // quedaron cableados a sus eventos en UiSounds (V2-resto). Si uno
        // vuelve a quedar huerfano, este sello vuelve a fallar.
        def legacyAllowlist = [] as Set
        def modSounds = file('src/main/java/com/eternalcraft/gripeverde/client/audio/ModSounds.java').getText('UTF-8')
        def fields = [] as Set
        (modSounds =~ /RegistryObject<SoundEvent>\s+(\w+)\s*=\s*reg\(/).each { m -> fields << m[1] }
        def code = new StringBuilder()
        fileTree('src/main/java') { include '**/*.java'; exclude '**/ModSounds.java' }.each { f ->
            code.append(f.getText('UTF-8'))
        }
        def codeText = code.toString()
        def unused = fields.findAll { f -> !codeText.contains(f) } as Set
        def problems = []
        (unused - legacyAllowlist).sort().each {
            problems << "${it}: SoundEvent registrado sin uso en codigo (conectarlo o retirarlo)"
        }
        (legacyAllowlist - unused).sort().each {
            problems << "${it}: ya esta en uso; sacarlo del allowlist legacy del sello"
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Sound usage validation failed:\n" + problems.join('\n'))
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeSoundUsage')
}

tasks.register('verifyGripeVerdeMenuFont') {
    group = 'verification'
    description = 'Verifies that diary text uses plain Minecraft string rendering and no missing custom provider.'
    doLast {
        def typographyFile = file('src/main/java/com/eternalcraft/gripeverde/client/render/DiaryTypography.java')
        def typography = typographyFile.getText('UTF-8')
        if (!typography.contains('graphics.drawString(font, text, x, y, color, shadow)') ||
                !typography.contains('graphics.drawString(font, text.getString(), x, y, color, shadow)') ||
                typography.contains('style.withFont(')) {
            throw new GradleException('DiaryTypography must render plain strings without custom font styles')
        }
        def fontDir = file('src/main/resources/assets/gripeverde/font')
        def customFonts = fileTree(fontDir) {
            include '*.json'
            include '*.ttf'
        }.files
        if (!customFonts.isEmpty()) {
            throw new GradleException("Unexpected custom menu fonts remain: ${customFonts*.name.sort()}")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyGripeVerdeMenuFont')
}
